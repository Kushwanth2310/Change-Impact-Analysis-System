<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debug Analysis - CIAS</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; }
        .debug-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .debug-title { font-weight: bold; color: #333; margin-bottom: 10px; }
        .debug-content { background: #f5f5f5; padding: 10px; border-radius: 3px; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <h1>Debug Analysis Page</h1>
    
    <div class="debug-section">
        <div class="debug-title">1. LocalStorage Data</div>
        <div id="localStorageData" class="debug-content">Loading...</div>
    </div>
    
    <div class="debug-section">
        <div class="debug-title">2. Change Requests</div>
        <div id="changeRequests" class="debug-content">Loading...</div>
    </div>
    
    <div class="debug-section">
        <div class="debug-title">3. Artifacts</div>
        <div id="artifacts" class="debug-content">Loading...</div>
    </div>
    
    <div class="debug-section">
        <div class="debug-title">4. Dependencies</div>
        <div id="dependencies" class="debug-content">Loading...</div>
    </div>
    
    <div class="debug-section">
        <div class="debug-title">5. Analysis Test</div>
        <div id="analysisTest" class="debug-content">Loading...</div>
    </div>

    <script src="security.js"></script>
    <script src="userStorage.js"></script>
    <script src="changeRequest.js"></script>
    <script src="artifactManager.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Check localStorage
            const storageKeys = ['cias_change_requests', 'cias_artifacts', 'cias_artifact_dependencies', 'cias_change_request_artifacts'];
            let storageHTML = '<pre>';
            storageKeys.forEach(key => {
                const data = localStorage.getItem(key);
                storageHTML += `${key}: ${data ? 'EXISTS (' + JSON.parse(data).length + ' items)' : 'NOT FOUND'}\n`;
            });
            storageHTML += '</pre>';
            document.getElementById('localStorageData').innerHTML = storageHTML;
            
            // Initialize systems
            const changeRequestSystem = new ChangeRequestSystem();
            const artifactManager = new ArtifactManager();
            
            // Get change requests
            const requests = changeRequestSystem.getChangeRequests();
            document.getElementById('changeRequests').innerHTML = `<pre>${JSON.stringify(requests, null, 2)}</pre>`;
            
            // Get artifacts
            const artifacts = artifactManager.getArtifacts();
            document.getElementById('artifacts').innerHTML = `<pre>Total: ${artifacts.length} artifacts\n${JSON.stringify(artifacts.slice(0, 3), null, 2)}</pre>`;
            
            // Get dependencies
            const dependencies = artifactManager.getDependencies();
            document.getElementById('dependencies').innerHTML = `<pre>Total: ${dependencies.length} dependencies\n${JSON.stringify(dependencies.slice(0, 3), null, 2)}</pre>`;
            
            // Test analysis with sample change request
            if (requests.length > 0) {
                const sampleRequest = requests[0];
                const analysis = artifactManager.analyzeImpact(sampleRequest);
                document.getElementById('analysisTest').innerHTML = `
                    <h4>Sample Request: ${sampleRequest.id}</h4>
                    <pre>${JSON.stringify(sampleRequest, null, 2)}</pre>
                    <h4>Analysis Result:</h4>
                    <pre>${JSON.stringify(analysis, null, 2)}</pre>
                `;
            } else {
                // Create test change request
                const testRequest = {
                    id: 'TEST-001',
                    changeType: 'feature',
                    description: 'Add user authentication functionality',
                    priority: 'high',
                    requestedBy: 'test_user',
                    dateOfSubmission: new Date().toISOString()
                };
                
                const analysis = artifactManager.analyzeImpact(testRequest);
                document.getElementById('analysisTest').innerHTML = `
                    <h4>Test Request (Created)</h4>
                    <pre>${JSON.stringify(testRequest, null, 2)}</pre>
                    <h4>Analysis Result:</h4>
                    <pre>${JSON.stringify(analysis, null, 2)}</pre>
                `;
            }
        });
    </script>
</body>
</html>
